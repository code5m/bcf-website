name: Tongpin Browser E2E
on:
  push:
    branches: [main]
    paths:
      - 'tongpin/**'
      - 'server.mjs'
      - 'scripts/**'
      - 'apps/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.github/workflows/**'
  pull_request:
    paths: ['tongpin/**','server.mjs','.github/workflows/browser-e2e.yml']
  workflow_dispatch:
concurrency:
  group: tongpin-3-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c tongpin/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tongpin-ui-preview
          path: |
            test-results/tongpin-desktop-library.png
            test-results/tongpin-mobile-library.png
            test-results/tongpin-demo-*.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tongpin-browser-failure-traces
          path: test-results/
          retention-days: 7
