name: tongpin
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4173"
      TONGPIN_DATA_DIR: /app/runtime/social
      TONGPIN_PUBLIC_ORIGIN: https://${TONGPIN_DOMAIN:?TONGPIN_DOMAIN_required}
      TONGPIN_ADMIN_TOKEN: ${TONGPIN_ADMIN_TOKEN:?TONGPIN_ADMIN_TOKEN_required}
      TONGPIN_INVITE_ONLY: "1"
      TONGPIN_TRUST_PROXY: "1"
    volumes:
      - tongpin_runtime:/app/runtime
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4173/api/social/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports: ["80:80","443:443"]
    environment:
      TONGPIN_DOMAIN: ${TONGPIN_DOMAIN:?TONGPIN_DOMAIN_required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
networks:
  internal:
volumes:
  tongpin_runtime:
  caddy_data:
  caddy_config:
