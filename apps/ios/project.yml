name: Tongpin
options:
  bundleIdPrefix: com.code5m
  deploymentTarget:
    iOS: "16.0"
targets:
  Tongpin:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.code5m.tongpin
        PRODUCT_NAME: 同频
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 同频
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
